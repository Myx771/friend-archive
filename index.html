<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>朋友档案馆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
  :root {
    --bg: #f8f9fc;
    --surface: #ffffff;
    --surface-hover: #f7f8fb;
    --text: #1a1d2b;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --accent-hover: #4338ca;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --warning: #f59e0b;
    --warning-bg: #fffbeb;
    --success: #10b981;
    --radius-sm: 12px;
    --radius: 16px;
    --radius-lg: 24px;
    --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,.06), 0 2px 4px -2px rgba(0,0,0,.04);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.08), 0 8px 10px -6px rgba(0,0,0,.04);
    --shadow-xl: 0 25px 50px -12px rgba(0,0,0,.15);
    --transition: .25s cubic-bezier(.4,0,.2,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: "Inter", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 顶部 ===== */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(16px) saturate(1.8);
    -webkit-backdrop-filter: blur(16px) saturate(1.8);
    border-bottom: 1px solid rgba(0,0,0,.04);
    padding: 20px 24px 16px;
  }
  .header-inner {
    max-width: 1120px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 42px; height: 42px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 4px 14px rgba(79,70,229,.35);
  }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .brand p { font-size: 12px; color: var(--text-3); margin-top: -2px; }

  /* ===== 工具栏 ===== */
  .toolbar {
    max-width: 1120px; margin: 20px auto 0; padding: 0 24px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .search-wrap {
    flex: 1; min-width: 220px; position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 11px 16px 11px 42px; border-radius: var(--radius);
    border: 1.5px solid #e5e7eb; font-size: 14px; outline: none;
    background: var(--surface); transition: var(--transition); color: var(--text);
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 14px; opacity: .6; pointer-events: none;
  }
  .btn {
    padding: 11px 20px; border: none; border-radius: var(--radius); cursor: pointer;
    font-size: 14px; font-weight: 600; transition: var(--transition); user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary {
    background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,.3);
  }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,.35); }
  .btn-primary:active { transform: scale(.98); }
  .btn-ghost { background: var(--surface); color: var(--text-2); border: 1.5px solid #e5e7eb; }
  .btn-ghost:hover { background: #f3f4f6; border-color: #d1d5db; }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1.5px solid #fecaca; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }

  /* ===== 统计 + 横幅 ===== */
  .banner {
    max-width: 1120px; margin: 16px auto 0; padding: 0 24px;
  }
  .banner-inner {
    display: none; align-items: center; gap: 10px; padding: 12px 18px;
    background: var(--warning-bg); border: 1px solid #fde68a; border-radius: var(--radius);
    font-size: 13px; color: #92400e; animation: slideDown .3s ease;
  }
  .banner-inner.show { display: flex; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .stats {
    max-width: 1120px; margin: 16px auto 0; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid #e5e7eb; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; color: var(--text-2); font-weight: 500;
    box-shadow: var(--shadow);
  }

  /* ===== 卡片列表 ===== */
  .grid {
    max-width: 1120px; margin: 18px auto 80px; padding: 0 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px;
  }
  .card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 24px; cursor: pointer; position: relative; overflow: hidden;
    border: 1px solid rgba(0,0,0,.04);
    box-shadow: var(--shadow); transition: var(--transition);
    animation: cardIn .4s ease both;
  }
  .card:nth-child(1){ animation-delay: .02s }
  .card:nth-child(2){ animation-delay: .04s }
  .card:nth-child(3){ animation-delay: .06s }
  .card:nth-child(4){ animation-delay: .08s }
  .card:nth-child(5){ animation-delay: .10s }
  .card:nth-child(6){ animation-delay: .12s }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: var(--shadow-lg);
    border-color: rgba(79,70,229,.08);
  }
  .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    transition: var(--transition);
  }
  .card:hover .avatar { transform: scale(1.08); }
  .card-info { min-width: 0; }
  .card-info h3 {
    font-size: 17px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-info .sub {
    font-size: 13px; color: var(--text-3); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-light); color: var(--accent);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
    transition: var(--transition);
  }
  .tag:hover { background: #e0e7ff; }
  .card-meta {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid #f3f4f6;
    display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; color: var(--text-2);
  }
  .card-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .birthday-soon { color: #ea580c; font-weight: 600; }
  .empty {
    grid-column: 1/-1; text-align: center; color: var(--text-3); padding: 100px 20px;
  }
  .empty .big { font-size: 64px; margin-bottom: 16px; opacity: .5; }
  .empty p { font-size: 15px; }

  /* ===== 弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
    padding: 32px; box-shadow: var(--shadow-xl); animation: pop .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h2 { margin-bottom: 24px; font-size: 20px; font-weight: 700; }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600; color: var(--text-2);
    margin-bottom: 6px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: var(--radius-sm);
    font-size: 14px; outline: none; transition: var(--transition); color: var(--text); background: var(--surface);
    font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1);
  }
  .form-group textarea { resize: vertical; min-height: 90px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* 详情弹窗 */
  .detail-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .detail-head .avatar { width: 64px; height: 64px; font-size: 26px; }
  .detail-row { padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--text-3); display: inline-block; width: 64px; font-weight: 500; }
  .detail-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .detail-row a:hover { text-decoration: underline; }

  /* ===== 密码锁屏 ===== */
  .lock-screen {
    position: fixed; inset: 0; z-index: 200;
    background: linear-gradient(135deg, #eef2ff 0%, #f8f9fc 50%, #faf5ff 100%);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-screen.show { display: flex; }
  .lock-card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 40px 36px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: var(--shadow-xl); animation: pop .3s cubic-bezier(.34,1.56,.64,1);
  }
  .lock-icon {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 32px; box-shadow: 0 8px 24px rgba(79,70,229,.35);
  }
  .lock-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .lock-card p { font-size: 13px; color: var(--text-3); margin-bottom: 24px; }
  .lock-card input {
    width: 100%; padding: 13px 16px; border: 1.5px solid #e5e7eb; border-radius: var(--radius-sm);
    font-size: 15px; outline: none; text-align: center; letter-spacing: 2px;
    transition: var(--transition); margin-bottom: 12px; font-family: inherit;
  }
  .lock-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .lock-card .btn { width: 100%; justify-content: center; padding: 13px; }
  .lock-error {
    color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px;
  }
  .lock-card.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-8px); }
    40%,80% { transform: translateX(8px); }
  }
  .lock-tip { margin-top: 16px; font-size: 12px; color: var(--text-3); }
  .lock-tip a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .lock-tip a:hover { text-decoration: underline; }

  /* ===== 图片上传 ===== */
  .upload-row { display: flex; gap: 10px; align-items: center; }
  .upload-preview {
    width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover;
    border: 1.5px solid #e5e7eb; display: none; background: #f3f4f6;
  }
  .upload-preview.show { display: block; }
  img.avatar { object-fit: cover; border: none; }
  .sticker-img { width: 36px; height: 36px; object-fit: contain; margin-left: auto; }

  /* ===== 星空视图（3D） ===== */
  #skyView { max-width: 1120px; margin: 18px auto 80px; padding: 0 24px; display: none; }
  .sky-inner {
    position: relative; height: 72vh; min-height: 520px;
    border-radius: var(--radius-lg); overflow: hidden; cursor: grab;
    box-shadow: var(--shadow-lg), inset 0 0 140px rgba(0,0,0,.55);
    background:
      radial-gradient(ellipse 60% 45% at 72% 18%, rgba(124,58,237,.28), transparent 70%),
      radial-gradient(ellipse 55% 40% at 22% 78%, rgba(37,99,235,.22), transparent 70%),
      linear-gradient(160deg, #131a3a 0%, #0b1029 45%, #05070f 100%);
  }
  .sky-inner:active { cursor: grabbing; }
  .sky-inner canvas { display: block; }
  .star-tip {
    position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: rgba(10,14,35,.92); border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #e5e9ff;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: var(--transition); z-index: 7;
  }
  .star3d-label {
    position: absolute; top: 0; left: 0; z-index: 3;
    text-align: center; cursor: pointer; user-select: none; will-change: transform;
  }
  .star3d-label .n {
    font-size: 12px; color: rgba(235,239,255,.95); letter-spacing: .5px;
    text-shadow: 0 0 8px rgba(0,0,0,.95); white-space: nowrap;
  }
  .star3d-label.dim { opacity: .12; }
  .star3d-label:hover .star-tip { opacity: 1; transform: translateX(-50%) translateY(0); }
  .sky-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(200,208,255,.55); font-size: 14px; letter-spacing: 1px; text-align: center; padding: 20px; z-index: 4;
  }
  .sky-help {
    position: absolute; bottom: 12px; right: 16px; z-index: 4;
    font-size: 11px; color: rgba(200,208,255,.45); letter-spacing: .5px; pointer-events: none;
  }
</style>
</head>
<body>

<!-- 密码锁屏 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card" id="lockCard">
    <div class="lock-icon">🔒</div>
    <h2 id="lockTitle">朋友档案馆</h2>
    <p id="lockDesc">请输入密码解锁</p>
    <div class="lock-error" id="lockError"></div>
    <input type="password" id="lockPwd" placeholder="输入密码" maxlength="32" autocomplete="off">
    <button class="btn btn-primary" id="lockBtn" onclick="submitLock()">解锁</button>
    <div class="lock-tip" id="lockTip"></div>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">👥</div>
      <div>
        <h1>朋友档案馆</h1>
        <p>记录每一份珍贵的友谊</p>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="stat-pill" id="roleBadge" style="display:none"></span>
      <button class="btn btn-ghost btn-sm" id="viewToggle" onclick="toggleView()" title="切换视图">⭐ 星空</button>
      <button class="btn btn-ghost btn-sm" id="shareBtn" onclick="exportShare()" title="导出分享版">📤 分享</button>
      <button class="btn btn-ghost btn-sm" onclick="lockNow()" title="锁定">🔒 锁定</button>
      <button class="btn btn-primary" id="addBtn" onclick="openForm()">＋ 新建档案</button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="搜索姓名、爱好、标签…">
  </div>
  <select id="sortSelect" class="btn btn-ghost" style="outline:none; padding-right:28px">
    <option value="new">最近添加</option>
    <option value="name">按姓名</option>
    <option value="birthday">按生日</option>
  </select>
</div>

<div class="banner" id="birthdayBanner"><div class="banner-inner" id="birthdayInner"></div></div>

<div class="stats" id="statsBar"></div>
<div class="grid" id="cardGrid"></div>

<!-- 星空视图 -->
<div id="skyView">
  <div class="sky-inner" id="skyInner"></div>
</div>

<!-- 新建/编辑 表单弹窗 -->
<div class="modal-mask" id="formMask">
  <div class="modal">
    <h2 id="formTitle">新建朋友档案</h2>
    <form id="friendForm" onsubmit="saveFriend(event)">
      <input type="hidden" id="fId">
      <div class="form-group">
        <label>姓名 *</label>
        <input id="fName" required maxlength="20" placeholder="朋友的名字">
      </div>
      <div class="form-group">
        <label>昵称</label>
        <input id="fNickname" maxlength="20" placeholder="平时怎么称呼TA">
      </div>
      <div class="form-group">
        <label>照片</label>
        <div class="upload-row">
          <img class="upload-preview" id="photoPreview" alt="">
          <input type="file" id="fPhoto" accept="image/*" style="display:none" onchange="onPhotoPick(event)">
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('fPhoto').click()">📷 选择照片</button>
          <button type="button" class="btn btn-ghost btn-sm" id="photoClearBtn" style="display:none" onclick="clearPhoto()">移除</button>
        </div>
      </div>
      <div class="form-group">
        <label>生日</label>
        <input id="fBirthday" type="date">
      </div>
      <div class="form-group">
        <label>电话</label>
        <input id="fPhone" maxlength="20" placeholder="手机号码">
      </div>
      <div class="form-group">
        <label>爱好 / 标签</label>
        <input id="fTags" placeholder="用逗号分隔，如：篮球, 音乐, 吃货">
      </div>
      <div class="form-group">
        <label>最喜欢的表情包</label>
        <input id="fEmoji" maxlength="10" placeholder="输入 emoji，如：🐶 😂">
        <div class="upload-row" style="margin-top:8px">
          <img class="upload-preview" id="stickerPreview" alt="">
          <input type="file" id="fSticker" accept="image/*" style="display:none" onchange="onStickerPick(event)">
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('fSticker').click()">�️ 或上传图片</button>
          <button type="button" class="btn btn-ghost btn-sm" id="stickerClearBtn" style="display:none" onclick="clearSticker()">移除</button>
        </div>
      </div>
      <div class="form-group">
        <label>视频（可选，建议 30 秒以内 / 50MB 以下）</label>
        <div class="upload-row">
          <input type="file" id="fVideo" accept="video/*" style="display:none" onchange="onVideoPick(event)">
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('fVideo').click()">🎬 选择视频</button>
          <button type="button" class="btn btn-ghost btn-sm" id="videoClearBtn" style="display:none" onclick="clearVideo()">移除视频</button>
          <span id="videoStatus" style="font-size:12px;color:var(--text-3)"></span>
        </div>
        <video id="videoPreview" class="upload-preview-video" controls style="display:none;margin-top:8px;max-width:100%;max-height:220px;border-radius:10px"></video>
      </div>
      <div class="form-group">
        <label>口头禅</label>
        <input id="fCatchphrase" maxlength="50" placeholder="TA最常说的话">
      </div>
      <div class="form-group">
        <label>最喜欢的一句话</label>
        <input id="fQuote" maxlength="100" placeholder="TA的人生格言或最爱引用">
      </div>
      <div class="form-group">
        <label>雷区（不喜欢别人做什么）</label>
        <textarea id="fDislike" placeholder="如：不喜欢被放鸽子、讨厌别人动TA的东西…"></textarea>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="fNote" placeholder="想记住的任何事情…"></textarea>
      </div>
      <div class="form-group">
        <label>访客可见范围（不勾选 = 仅管理员可见）</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--text-2)">
          <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" class="vis-chk" data-k="photo" checked> 头像照片</label>
          <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" class="vis-chk" data-k="phone" checked> 电话</label>
          <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" class="vis-chk" data-k="birthday" checked> 生日</label>

function hashPwd(pwd) {
  const msg = 'friend_archive_salt::' + pwd;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < msg.length; i++) {
    const ch = msg.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h2>>>0).toString(16) + (h1>>>0).toString(16);
}

function memberAuthKey() { return 'fa_member_auth::' + memberName; }
function memberVerified() { return sessionStorage.getItem(memberAuthKey()) === '1'; }

function ownerVerified(f) {

function askMemberName() {

function changeMemberName() {

  const next = name.trim();

  friends.forEach(f => { if (f.owner === memberName) f.owner = next; });

  memberName = next;
  sessionStorage.setItem('fa_member_name', memberName);
  if (wasVerified) setMemberVerified();

}

function submitLock() {

// 云端同步：拉取最新数据；若云端为空而本地有数据，则自动把本地数据迁移上云（只发生一次）
async function syncFromCloud() {
  if (!db) return;
  try {
    const { data, error } = await db.from(DB_TABLE).select('*');
    if (error) throw error;
    const migrated = localStorage.getItem('fa_cloud_migrated');
    if (data && data.length) {
      friends = data;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
      localStorage.setItem('fa_cloud_migrated', '1');
      render();
    } else if (friends.length && !migrated) {
      await persist(); // 首次迁移：本地 → 云端
      localStorage.setItem('fa_cloud_migrated', '1');
    } else if (!friends.length || migrated) {
      friends = []; // 云端确实是空的（例如管理员删光了），以云端为准
      try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
      render();
    }
  } catch(e) { console.warn('云端同步失败，本次使用本地数据：', e); }
}

// 管理员导出「分享版」HTML：把当前档案数据直接嵌入文件
function exportShare() {

async function persist() {
  // 每次完整保存到本地兜底
  try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
  // 同步云端（只在数据库已配置时）
  if (!db) return;
  try {
    const { error } = await db.from(DB_TABLE).upsert(friends, { onConflict: 'id' });
    if (error) {
      console.warn('云端同步失败：', error);
      // 字段缺失等结构性问题，明确提示用户
      if (error.code === '42703' || error.code === 'PGRST204' || /column .* does not exist|could not find the .* column/i.test(error.message||'')) {
        alert('⚠️ 保存失败：云端数据库缺少字段。\n请让网站管理员在 Supabase 的 SQL Editor 里运行：\n\nalter table friends add column if not exists "pwdHash" text;\nalter table friends add column if not exists video text;\nnotify pgrst, \'reload schema\';\n\n运行后再试一次。');
      } else {
        alert('⚠️ 保存到云端失败，请检查网络后重试：' + (error.message || error));
      }
    }
  } catch(e) { console.warn('云端同步异常：', e); }
}

/* ---------- 工具 ---------- */
function getZodiac(b) {
  if(!b) return '';
  const [,m,d] = b.split('-').map(Number);
  const z = [20,19,21,20,21,22,23,23,23,24,23,22];
  const names = ['摩羯','水瓶','双鱼','白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯'];
  return names[m-1 + (d >= z[m-1] ? 1 : 0)];
}
function getAge(b) {
  if(!b) return null;
  const today = new Date();
  const [y,m,d] = b.split('-').map(Number);
  let age = today.getFullYear() - y;
  if (today.getMonth()+1 < m || (today.getMonth()+1 === m && today.getDate() < d)) age--;
  return age >= 0 ? age : null;
}
function daysToBirthday(b) {
  if (!b) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const [, m, d] = b.split('-').map(Number);
  let next = new Date(today.getFullYear(), m-1, d);
  if (next < today) next = new Date(today.getFullYear()+1, m-1, d);
  return Math.round((next - today) / 86400000);
}

/* ---------- 渲染 ---------- */
function render() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  const grid = document.getElementById('cardGrid');
  const bannerInner = document.getElementById('birthdayInner');
  const stats = document.getElementById('statsBar');

  let list = friends.filter(f => {
    if (!kw) return true;
    return [f.name, f.nickname, f.tags, f.note, f.phone]
      .filter(Boolean).join(' ').toLowerCase().includes(kw);
  });

  if (sort === 'name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else if (sort === 'birthday') {
    list.sort((a,b)=>{
      const da = daysToBirthday(a.birthday), db = daysToBirthday(b.birthday);
      return (da==null?9999:da) - (db==null?9999:db);
    });
  } else list.sort((a,b)=>b.created - a.created);

  // 新建按钮：成员已有档案时隐藏（管理员始终可见）
  document.getElementById('addBtn').style.display = canAdd() ? 'inline-flex' : 'none';

  // 统计
  stats.innerHTML = friends.length
    ? `<span class="stat-pill">🧑‍🤝‍🧑 共 ${friends.length} 位朋友</span>${kw?`<span class="stat-pill">🔍 匹配 ${list.length} 位</span>`:''}`
    : '';

  // 生日提醒（30天内）
  const upcoming = friends
    .map(f=>({f, d: daysToBirthday(f.birthday)}))
    .filter(x=>x.d!==null && x.d<=30 && canSee(x.f,'birthday'))
    .sort((a,b)=>a.d-b.d);
  if (upcoming.length) {
    bannerInner.className = 'banner-inner show';
    bannerInner.innerHTML = '🎂 ' + upcoming.map(({f,d})=>
      d===0 ? `<b>${esc(f.name)}</b> 今天生日 🎉` : `<b>${esc(f.name)}</b> ${d} 天后生日`
    ).join('　·　');
  } else bannerInner.className = 'banner-inner';

  // 卡片
  if (!list.length) {
    const emptyTip = friends.length
      ? '没有找到匹配的朋友'
      : (currentRole === 'admin' ? '还没有档案，点击右上角「新建档案」开始吧'
         : currentRole === 'member' ? '还没有档案，点击右上角「＋ 新建档案」创建你自己的吧'
         : '暂无档案，请联系管理员添加');
    grid.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${emptyTip}</p>
    </div>`;
  } else {
  grid.innerHTML = list.map(f=>{
    const d = daysToBirthday(f.birthday);
    const age = getAge(f.birthday);
    const zodiac = getZodiac(f.birthday);
    const tags = (f.tags||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    return `<div class="card" onclick="openDetail('${f.id}')">
      <div class="card-head">
        ${avatarHTML(f)}
        <div class="card-info">
          <h3>${esc(f.name)}${f.locked?' 🔒':''}${isMember()&&f.owner===memberName?' <span style="font-size:11px;color:var(--accent);font-weight:600">（我）</span>':''}</h3>
          <div class="sub">${f.nickname?esc(f.nickname)+' · ':''}${zodiac?esc(zodiac)+'座':''}${age!=null?' · '+age+'岁':''}</div>
        </div>
        ${stickerHTML(f)}
      </div>
      ${f.catchphrase&&canSee(f,'catchphrase')?`<div style="font-size:13px;color:var(--text-2);font-style:italic;margin:-6px 0 10px">"${esc(f.catchphrase)}"</div>`:''}
      <div class="tag-row">${canSee(f,'tags')?tags.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join(''):''}</div>
      <div class="card-meta">
        ${f.phone&&canSee(f,'phone')?`<span>📞 ${esc(f.phone)}</span>`:''}
        ${f.birthday&&canSee(f,'birthday')?`<span class="${d!==null&&d<=7?'birthday-soon':''}">🎂 ${d===0?'今天！':d+'天后'}</span>`:''}
      </div>
    </div>`;
  }).join('');
  }

  // 星空
  renderSky(list, kw);
}

// 用 id 做稳定伪随机，保证同一颗星星位置不变
function seedOf(id) {
  let h = 2166136261;
  for (const c of String(id)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}

let sky3d = null;          // {scene,camera,renderer,group,sprites[],labelLayer}
const skyRot = { x: 0.25, y: 0 };
const skyDrag = { on: false, x: 0, y: 0, moved: false };
let skyZoom = 220;
const texCache = {};

function glowTexture(color) {
  if (texCache[color]) return texCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.25, color);
  grad.addColorStop(0.6, color + '55');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c);
  texCache[color] = t;
  return t;
}

function initSky3D(container) {
  const w = container.clientWidth || 800, h = container.clientHeight || 520;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, w/h, 0.1, 2000);
  camera.position.z = skyZoom;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  container.appendChild(renderer.domElement);

  const group = new THREE.Group();
  group.rotation.x = skyRot.x;
  scene.add(group);

  // 背景星尘（1600 颗随机分布的微粒）
  const N = 1600, pos = new Float32Array(N*3);
  for (let i = 0; i < N; i++) {
    const r = 280 + Math.random()*320;
    const th = Math.random()*Math.PI*2, ph = Math.acos(Math.random()*2-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  const bgGeo = new THREE.BufferGeometry();
  bgGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  group.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({
    color: 0xcdd6ff, size: 1.6, transparent: true, opacity: .75, sizeAttenuation: true
  })));

  // 标签层
  const labelLayer = document.createElement('div');
  labelLayer.style.cssText = 'position:absolute;inset:0;overflow:hidden;pointer-events:none';
  container.appendChild(labelLayer);

  // 拖拽旋转
  const cv = renderer.domElement;
  cv.style.touchAction = 'none';
  cv.addEventListener('pointerdown', e => {
    skyDrag.on = true; skyDrag.moved = false;
    skyDrag.x = e.clientX; skyDrag.y = e.clientY;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!skyDrag.on) return;
    const dx = e.clientX - skyDrag.x, dy = e.clientY - skyDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) skyDrag.moved = true;
    skyRot.y += dx * 0.005;
    skyRot.x = Math.max(-1.2, Math.min(1.2, skyRot.x + dy * 0.005));
    skyDrag.x = e.clientX; skyDrag.y = e.clientY;
  });
  cv.addEventListener('pointerup', e => {
    skyDrag.on = false;
    if (!skyDrag.moved) skyPick(e); // 视为点击 → 拾取星星
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    skyZoom = Math.max(120, Math.min(400, skyZoom + e.deltaY * 0.15));
  }, { passive: false });

  sky3d = { scene, camera, renderer, group, sprites: [], labelLayer, container };
  requestAnimationFrame(skyTick);
}

function skyPick(e) {
  if (!sky3d) return;
  const r = sky3d.renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(
    ((e.clientX - r.left) / r.width) * 2 - 1,
    -((e.clientY - r.top) / r.height) * 2 + 1
  );
  const ray = new THREE.Raycaster();
  ray.setFromCamera(m, sky3d.camera);
  const hits = ray.intersectObjects(sky3d.sprites);
  if (hits.length) openDetail(hits[0].object.userData.fid);
}

function skyTick() {
  requestAnimationFrame(skyTick);
  if (!sky3d) return;
  const { scene, camera, renderer, group, sprites, labelLayer, container } = sky3d;
  if (viewMode !== 'sky' || !container.offsetParent) return; // 隐藏时不渲染

  // 尺寸自适应
  const w = container.clientWidth, h = container.clientHeight;
  const cv = renderer.domElement;
  if (cv.width !== Math.floor(w * renderer.getPixelRatio()) || cv.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  if (!skyDrag.on) skyRot.y += 0.0007; // 缓慢自转
  group.rotation.y = skyRot.y;
  group.rotation.x = skyRot.x;
  camera.position.z = skyZoom;

  const t = performance.now() / 1000;
  const v = new THREE.Vector3();
  for (const s of sprites) {
    const u = s.userData;
    // 呼吸脉动
    const sc = u.base * (1 + (u.soon ? 0.3 : 0.15) * Math.sin(t * (u.soon ? 4.5 : 1.8) + u.phase));
    s.scale.set(sc, sc, 1);
    // 标签跟随投影
    const lb = u.label;
    s.getWorldPosition(v).project(camera);
    if (v.z > 1 || v.z < -1) { lb.style.display = 'none'; continue; }
    lb.style.display = 'block';
    const x = (v.x * .5 + .5) * w, y = (-v.y * .5 + .5) * h;
    lb.style.transform = `translate(${x.toFixed(1)}px,${(y + u.base * 0.5 + 6).toFixed(1)}px) translateX(-50%)`;
  }
  renderer.render(scene, camera);
}

function renderSky(list, kw) {
  const container = document.getElementById('skyInner');
  if (!container) return;

  if (typeof THREE === 'undefined') {
    container.innerHTML = '<div class="sky-hint">3D 引擎加载失败<br>请检查网络后刷新重试</div>';
    return;
  }
  if (!sky3d) initSky3D(container);

  // 清空旧星星与标签
  for (const s of sky3d.sprites) {
    sky3d.group.remove(s);
    s.material.dispose();
  }
  sky3d.sprites = [];
  sky3d.labelLayer.innerHTML = '';
  container.querySelectorAll('.sky-hint,.sky-help').forEach(e => e.remove());

  if (!friends.length) {
    container.insertAdjacentHTML('beforeend', '<div class="sky-hint">这片夜空还没有星星<br>点击右上角「新建档案」点亮第一颗 ⭐</div>');
    return;
  }
  container.insertAdjacentHTML('beforeend', '<div class="sky-help">拖动旋转 · 滚轮缩放 · 点击星星查看档案</div>');

  const matchedIds = new Set(list.map(f => f.id));
  for (const f of friends) {
    const d = daysToBirthday(f.birthday);
    const soon = d !== null && d <= 7;
    const color = soon ? '#fbbf24' : colorOf(f.id);
    const dimmed = kw && !matchedIds.has(f.id);

    // 球面稳定分布
    const th = seedOf(f.id) * Math.PI * 2;
    const ph = Math.acos(seedOf(f.id + 'y') * 2 - 1);
    const r = 70 + seedOf(f.id + 'r') * 30;

    const mat = new THREE.SpriteMaterial({
      map: glowTexture(color), transparent: true,
      depthWrite: false, opacity: dimmed ? 0.12 : 1
    });
    const sp = new THREE.Sprite(mat);
    sp.position.set(
      r * Math.sin(ph) * Math.cos(th),
      r * Math.cos(ph) * 0.85,
      r * Math.sin(ph) * Math.sin(th)
    );
    const base = 13 + seedOf(f.id + 's') * 9 + (soon ? 4 : 0);
    sp.scale.set(base, base, 1);
    sp.userData = {
      fid: f.id, base, soon,
      phase: seedOf(f.id + 'p') * Math.PI * 2,
      label: null
    };
    sky3d.group.add(sp);
    sky3d.sprites.push(sp);

    // HTML 标签（名字 + 悬浮提示）
    const tipLines = [];
    if (f.catchphrase && canSee(f,'catchphrase')) tipLines.push(`💬 "${esc(f.catchphrase)}"`);
    if (f.birthday && canSee(f,'birthday')) tipLines.push(`🎂 ${d === 0 ? '今天生日！' : d + ' 天后生日'}`);
    if (f.tags && canSee(f,'tags')) tipLines.push(`🏷️ ${esc(f.tags)}`);
    const lb = document.createElement('div');
    lb.className = 'star3d-label' + (dimmed ? ' dim' : '');
    lb.style.pointerEvents = 'auto';
    lb.innerHTML = `<span class="n">${f.locked?'🔒 ':''}${esc(f.name)}${isMember()&&f.owner===memberName?' <span style="color:#a5b4fc">（我）</span>':''}</span><div class="star-tip">${tipLines.join('<br>') || '点击查看档案'}</div>`;
    lb.onclick = () => openDetail(f.id);
    sky3d.labelLayer.appendChild(lb);
    sp.userData.label = lb;
  }
}

/* ---------- 图片处理 ---------- */
let tempPhoto = '', tempSticker = '';

function compressImage(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize/width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize/height; height = maxSize; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function onPhotoPick(e) {
  const file = e.target.files[0]; if (!file) return;
  compressImage(file, 200, data => {
    tempPhoto = data;
    const p = document.getElementById('photoPreview');
    p.src = data; p.classList.add('show');
    document.getElementById('photoClearBtn').style.display = 'inline-flex';
  });
  e.target.value = '';
}
function clearPhoto() {
  tempPhoto = '';
  document.getElementById('photoPreview').classList.remove('show');
  document.getElementById('photoClearBtn').style.display = 'none';
}
function onStickerPick(e) {
  const file = e.target.files[0]; if (!file) return;
  compressImage(file, 120, data => {
    tempSticker = data;
    const p = document.getElementById('stickerPreview');
    p.src = data; p.classList.add('show');
    document.getElementById('stickerClearBtn').style.display = 'inline-flex';
  });
  e.target.value = '';
}
function clearSticker() {
  tempSticker = '';
  document.getElementById('stickerPreview').classList.remove('show');
  document.getElementById('stickerClearBtn').style.display = 'none';
}

/* ---------- 视频处理（存 Supabase Storage，数据库只存链接） ---------- */
const VIDEO_BUCKET = 'videos';
const VIDEO_MAX_MB = 100;
let tempVideo = '';        // 视频公开访问 URL
let tempVideoPath = '';    // Storage 内路径（删除/替换用）
let videoUploading = false;

function videoExt(file) {
  const m = (file.type||'').split('/')[1];
  if (m === 'quicktime') return 'mov';
  if (m === 'x-matroska') return 'mkv';
  return (m || 'mp4').replace(/[^a-z0-9]/gi,'');
}
// 从公开 URL 还原 Storage 对象路径
function urlToStoragePath(url) {
  if (!url) return '';
  const marker = '/storage/v1/object/public/' + VIDEO_BUCKET + '/';
  const i = url.indexOf(marker);
  return i >= 0 ? decodeURIComponent(url.slice(i + marker.length)) : '';
}
async function deleteStorageVideo(urlOrPath) {
  if (!db || !urlOrPath) return;
  const p = urlOrPath.startsWith('http') ? urlToStoragePath(urlOrPath) : urlOrPath;
  if (!p) return;
  try { await db.storage.from(VIDEO_BUCKET).remove([p]); } catch(e){}
}
function setVideoStatus(txt, color) {
  const el = document.getElementById('videoStatus');
  if (!el) return;
  el.textContent = txt;
  el.style.color = color || 'var(--text-3)';
}
function showVideoPreview(url) {
  const v = document.getElementById('videoPreview');
  v.src = url; v.style.display = url ? 'block' : 'none';
  document.getElementById('videoClearBtn').style.display = url ? 'inline-flex' : 'none';
}
async function onVideoPick(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (!db) { alert('云端存储未配置，无法上传视频。'); return; }
  const mb = file.size / 1024 / 1024;
  if (mb > VIDEO_MAX_MB) { alert('视频太大了（' + mb.toFixed(1) + 'MB），请上传 ' + VIDEO_MAX_MB + 'MB 以内的短视频。'); return; }

  // 先本地预览
  const localUrl = URL.createObjectURL(file);
  showVideoPreview(localUrl);
  setVideoStatus('☁️ 上传中 0%', 'var(--warning)');
  videoUploading = true;

  const path = (editingId || uid()) + '_' + Date.now() + '.' + videoExt(file);
  try {
    const { error } = await db.storage.from(VIDEO_BUCKET).upload(path, file, {
      contentType: file.type || 'video/mp4',
      upsert: true,
      onUploadProgress: (evt) => {
        if (evt.total) setVideoStatus('☁️ 上传中 ' + Math.round(evt.loaded/evt.total*100) + '%', 'var(--warning)');
      }
    });
    if (error) throw error;
    const { data } = db.storage.from(VIDEO_BUCKET).getPublicUrl(path);
    // 替换旧视频
    if (tempVideoPath && tempVideoPath !== path) await deleteStorageVideo(tempVideoPath);
    tempVideo = data.publicUrl;
    tempVideoPath = path;
    videoUploading = false;
    showVideoPreview(tempVideo);
    setVideoStatus('✅ 上传完成（' + mb.toFixed(1) + 'MB），记得点下面的保存', 'var(--success)');
  } catch(e) {
    videoUploading = false;
    showVideoPreview('');
    tempVideo = ''; tempVideoPath = '';
    setVideoStatus('', '');
    const msg = String(e.message || e);
    if (/bucket|404|not found/i.test(msg)) {
      alert('视频存储空间还没创建。\n请让管理员在 Supabase 的 SQL Editor 运行建桶语句（见发布说明）后再试。');
    } else {
      alert('视频上传失败：' + msg);
    }
  }
}
async function clearVideo() {
  if (videoUploading) { alert('视频还在上传中，请稍候…'); return; }
  if (tempVideoPath) await deleteStorageVideo(tempVideoPath);
  tempVideo = ''; tempVideoPath = '';
  showVideoPreview('');
  setVideoStatus('', '');
}
function avatarHTML(f, sizeClass) {
  // 照片仅在管理员允许访客查看时显示；隐藏则回退为彩色首字头像
  if (f.photo && canSee(f,'photo')) return `<img class="avatar" src="${f.photo}" alt="">`;
  return `<div class="avatar" style="background:${colorOf(f.id)}">${esc((f.nickname||f.name).charAt(0))}</div>`;
}
function stickerHTML(f) {
  if (f.sticker && canSee(f,'sticker')) return `<img class="sticker-img" src="${f.sticker}" alt="">`;
  if (f.emoji && canSee(f,'emoji')) return `<div style="font-size:24px;margin-left:auto">${esc(f.emoji)}</div>`;
  return '';
}

/* ---------- 表单 ---------- */
function openForm(f) {
  // f 为空 = 新建；非空 = 编辑（需权限）
  if (f) {
    if (!canEdit(f)) { alert(f.locked ? '该档案已被管理员锁定，无法编辑。' : '你只能编辑自己创建的档案。'); return; }
  } else if (!canAdd()) {
    if (currentRole === 'member') alert('每人只能创建一个档案，你的档案已经存在啦～\n如需重新创建，请联系管理员删除现有档案。');
    else alert('访客模式无法新建，请使用成员或管理员密码登录。');
    return;
  }
  editingId = f ? f.id : null;
  document.getElementById('formTitle').textContent = f ? '编辑档案' : '新建朋友档案';
  document.getElementById('fId').value = f ? f.id : '';
  document.getElementById('fName').value = f ? f.name : '';
  document.getElementById('fNickname').value = f ? (f.nickname||'') : '';
  document.getElementById('fBirthday').value = f ? (f.birthday||'') : '';
  document.getElementById('fPhone').value = f ? (f.phone||'') : '';
  document.getElementById('fTags').value = f ? (f.tags||'') : '';
  document.getElementById('fEmoji').value = f ? (f.emoji||'') : '';
  document.getElementById('fCatchphrase').value = f ? (f.catchphrase||'') : '';
  document.getElementById('fQuote').value = f ? (f.quote||'') : '';
  document.getElementById('fDislike').value = f ? (f.dislike||'') : '';
  document.getElementById('fNote').value = f ? (f.note||'') : '';
  // 回填可见性勾选（旧数据缺省全可见）
  const vis = f && f.visible ? f.visible : {};
  document.querySelectorAll('.vis-chk').forEach(c => { c.checked = vis[c.dataset.k] !== false; });
  tempPhoto = f ? (f.photo||'') : '';
  tempSticker = f ? (f.sticker||'') : '';
  const pp = document.getElementById('photoPreview');
  pp.src = tempPhoto; pp.classList.toggle('show', !!tempPhoto);
  document.getElementById('photoClearBtn').style.display = tempPhoto ? 'inline-flex' : 'none';
  const sp = document.getElementById('stickerPreview');
  sp.src = tempSticker; sp.classList.toggle('show', !!tempSticker);
  document.getElementById('stickerClearBtn').style.display = tempSticker ? 'inline-flex' : 'none';
  // 视频回填
  videoUploading = false;
  tempVideo = f ? (f.video||'') : '';
  tempVideoPath = f && f.video ? urlToStoragePath(f.video) : '';
  showVideoPreview(tempVideo);
  setVideoStatus('', '');
  document.getElementById('formMask').classList.add('show');
}
function closeForm(){ document.getElementById('formMask').classList.remove('show'); }

function saveFriend(e) {
  e.preventDefault();
  if (videoUploading) { alert('视频还在上传中，请等「✅ 上传完成」后再保存～'); return; }
  // 硬拦截：再次校验当前操作权限
  if (editingId) {
    const target = friends.find(x=>x.id===editingId);
    if (!canEdit(target)) { alert('没有权限保存此档案。'); return; }
  } else if (!canAdd()) {
    alert(currentRole === 'member' ? '每人只能创建一个档案，你已经创建过了。' : '没有权限新建档案。');
    return;
  }
  const data = {
    name: document.getElementById('fName').value.trim(),
    nickname: document.getElementById('fNickname').value.trim(),
    birthday: document.getElementById('fBirthday').value,
    phone: document.getElementById('fPhone').value.trim(),
    tags: document.getElementById('fTags').value.trim(),
    emoji: document.getElementById('fEmoji').value.trim(),
    catchphrase: document.getElementById('fCatchphrase').value.trim(),
    quote: document.getElementById('fQuote').value.trim(),
    dislike: document.getElementById('fDislike').value.trim(),
    note: document.getElementById('fNote').value.trim(),
    photo: tempPhoto,
    sticker: tempSticker,
    video: tempVideo,
  };
  // 收集访客可见范围
  const visible = {};
  document.querySelectorAll('.vis-chk').forEach(c => { visible[c.dataset.k] = c.checked; });
  data.visible = visible;
  if (!data.name) return;
  // 成员：新建档案时必须设置专属密码；旧档案没密码的，本次保存时补设
  if (!isAdmin()) {
    const existing = editingId ? friends.find(x=>x.id===editingId) : null;
    if (!existing || !existing.pwdHash) {
      const pwd = askNewMemberPwd();
      if (pwd === null) return; // 用户取消，留在编辑表单
      data.pwdHash = hashMemberPwd(pwd);
    }
  }
  if (editingId) {
    const f = friends.find(x=>x.id===editingId);
    if (f) Object.assign(f, data); // owner / locked 保留不动
  } else {
    // 新建：管理员创建的归属 admin；成员创建的归属自己的名字
    friends.push({ id: uid(), created: Date.now(), owner: isAdmin() ? 'admin' : memberName, locked: false, ...data });
    if (!isAdmin()) setMemberVerified(); // 刚设完密码，本设备直接通过
  }
  closeForm(); render();
  persist(); // 后台同步本地+云端
}

/* ---------- 详情 ---------- */
function openDetail(id) {
  const f = friends.find(x=>x.id===id);
  if (!f) return;

  const age = getAge(f.birthday);

  const tags = (f.tags||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  const admin = isAdmin();
  const editable = canEdit(f);
  const needVerify = isMember() && f.owner===memberName && !f.locked && !!f.pwdHash && !ownerVerified(f);
  const ownerLabel = f.owner && f.owner !== 'admin' ? esc(f.owner) : (f.owner === 'admin' ? '管理员' : '未知');
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-head">
      ${avatarHTML(f)}

        <h2>${f.locked?'🔒 ':''}${esc(f.name)}${age!=null?` <span style="font-size:14px;color:var(--text-3);font-weight:500">${age}岁</span>`:''}</h2>
        ${f.nickname?`<div style="color:var(--text-3);font-size:13px">昵称：${esc(f.nickname)}</div>`:''}
      </div>
    </div>
    ${f.birthday&&canSee(f,'birthday')?`<div class="detail-row"><span class="k">生日</span>${esc(f.birthday)}${zodiac?' · '+esc(zodiac)+'座':''}${d!==null?` · ${d===0?'就是今天！🎉':d+'天后'}`:''}</div>`:''}
    ${f.phone&&canSee(f,'phone')?`<div class="detail-row"><span class="k">电话</span><a href="tel:${esc(f.phone)}">${esc(f.phone)}</a></div>`:''}
    ${tags.length&&canSee(f,'tags')?`<div class="detail-row"><span class="k">爱好</span>${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    ${f.emoji&&canSee(f,'emoji')?`<div class="detail-row"><span class="k">表情包</span><span style="font-size:20px">${esc(f.emoji)}</span></div>`:''}
    ${f.sticker&&canSee(f,'sticker')?`<div class="detail-row"><span class="k">表情图</span><img src="${f.sticker}" style="width:64px;height:64px;object-fit:contain;border-radius:8px;vertical-align:middle"></div>`:''}
    ${f.video&&canSee(f,'video')?`<div class="detail-row"><span class="k">视频</span><video src="${esc(f.video)}" controls preload="metadata" playsinline style="max-width:100%;max-height:320px;border-radius:12px;vertical-align:middle;background:#000"></video></div>`:''}
    ${f.catchphrase&&canSee(f,'catchphrase')?`<div class="detail-row"><span class="k">口头禅</span>"${esc(f.catchphrase)}"</div>`:''}
    ${f.quote&&canSee(f,'quote')?`<div class="detail-row"><span class="k">最爱的话</span><i>${esc(f.quote)}</i></div>`:''}
    ${f.dislike&&canSee(f,'dislike')?`<div class="detail-row"><span class="k">⚠️ 雷区</span><span style="color:var(--danger)">${esc(f.dislike).replace(/\n/g,'<br>')}</span></div>`:''}
    ${f.note&&canSee(f,'note')?`<div class="detail-row"><span class="k">备注</span>${esc(f.note).replace(/\n/g,'<br>')}</div>`:''}
    ${admin?`<div class="detail-row" style="border-top:1px dashed #e5e7eb;margin-top:6px;padding-top:12px;font-size:12px;color:var(--text-3)">📝 创建者：${ownerLabel}　${f.locked?'🔒 已锁定（创建者无法再修改）':'🔓 未锁定'}　${f.owner&&f.owner!=='admin'?(f.pwdHash?'🔑 已设专属密码':'⚠️ 未设专属密码'):''}<br>🔒 访客可见：${(()=>{const K={photo:'头像照片',phone:'电话',birthday:'生日',tags:'爱好',emoji:'表情包',sticker:'表情图',video:'视频',catchphrase:'口头禅',quote:'最爱的话',dislike:'雷区',note:'备注'};const v=f.visible||{};const off=Object.keys(K).filter(k=>v[k]===false);return off.length?'隐藏 '+off.map(k=>K[k]).join('、'):'全部可见';})()}</div>`:''}
    ${isMember()&&f.owner===memberName&&f.locked?`<div class="detail-row" style="font-size:12px;color:var(--warning)">🔒 管理员已锁定此档案，你暂时无法修改</div>`:''}
    <div class="modal-actions">
      ${editable?`<button class="btn btn-danger btn-sm" onclick="removeFriend('${f.id}')">删除</button>`:''}
      <button class="btn btn-ghost btn-sm" onclick="closeDetail()">关闭</button>
      ${admin&&f.owner&&f.owner!=='admin'?`<button class="btn btn-ghost btn-sm" onclick="resetMemberPwd('${f.id}')" title="成员忘记密码时使用，清空后他可重新设置">🔑 重置密码</button>`:''}
      ${admin?`<button class="btn btn-ghost btn-sm" onclick="toggleLock('${f.id}')" style="${f.locked?'color:var(--success);border-color:#a7f3d0;background:#ecfdf5':'color:var(--warning);border-color:#fde68a;background:var(--warning-bg)'}">${f.locked?'🔓 解锁':'🔒 锁定'}</button>`:''}
      ${needVerify?`<button class="btn btn-primary btn-sm" onclick="verifyAndEdit('${f.id}')">🔑 输入密码编辑</button>`:''}
      ${editable?`<button class="btn btn-primary btn-sm" onclick="editFromDetail('${f.id}')">编辑</button>`:''}
    </div>`;
  document.getElementById('detailMask').classList.add('show');
}
function closeDetail(){ document.getElementById('detailMask').classList.remove('show'); }
function editFromDetail(id){ closeDetail(); openForm(friends.find(x=>x.id===id)); }
function removeFriend(id){
  const f = friends.find(x=>x.id===id);
  if (!f) return;
  if (!canEdit(f)) { alert(f.locked ? '该档案已被管理员锁定，无法删除。' : '你只能删除自己创建的档案。'); return; }
  if (!confirm(`确定要删除「${f.name}」的档案吗？此操作不可恢复。`)) return;
  if (f.video) deleteStorageVideo(f.video); // 一并删除云端视频文件
  friends = friends.filter(x=>x.id!==id);
  closeDetail(); render();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
  dbDelete(id); // 后台从云端删除
}

// 管理员锁定 / 解锁档案（锁定后创建者本人也不能改，管理员不受影响）
function toggleLock(id) {
  if (!isAdmin()) return;
  const f = friends.find(x=>x.id===id);
  if (!f) return;
  f.locked = !f.locked;
  render();
  openDetail(id);
  persist();
}

// 管理员重置成员的专属密码（清空后，该成员下次编辑时需重新设置）
function resetMemberPwd(id) {
  if (!isAdmin()) return;
  const f = friends.find(x=>x.id===id);
  if (!f || !f.owner || f.owner === 'admin') return;
  if (!confirm(`确定清空「${f.owner}」的专属密码吗？\n清空后他下次进入并编辑档案时，需要重新设置一个新密码。`)) return;
  f.pwdHash = null;
  render();
  openDetail(id);
  persist();
}

/* ---------- 事件 ---------- */
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('formMask').addEventListener('click', e=>{ if(e.target.id==='formMask') closeForm(); });
document.getElementById('detailMask').addEventListener('click', e=>{ if(e.target.id==='detailMask') closeDetail(); });

// 启动：先用本地缓存秒开，再从云端拉取最新数据
const savedRole = sessionStorage.getItem('fa_role');
if (savedRole === 'admin' || savedRole === 'guest') {
  currentRole = savedRole;
  unlock();
} else if (savedRole === 'member' && memberName) {
  currentRole = 'member';
  unlock();
} else {
  showLock();
}
applyViewMode();
syncFromCloud();
</script>
</body>
</html>
