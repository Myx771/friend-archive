<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朋友档案馆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f8f9fc;
    --surface: #ffffff;
    --surface-hover: #f7f8fb;
    --text: #1a1d2b;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --accent-hover: #4338ca;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --warning: #f59e0b;
    --warning-bg: #fffbeb;
    --success: #10b981;
    --radius-sm: 12px;
    --radius: 16px;
    --radius-lg: 24px;
    --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,.06), 0 2px 4px -2px rgba(0,0,0,.04);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.08), 0 8px 10px -6px rgba(0,0,0,.04);
    --shadow-xl: 0 25px 50px -12px rgba(0,0,0,.15);
    --transition: .25s cubic-bezier(.4,0,.2,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: "Inter", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 顶部 ===== */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(16px) saturate(1.8);
    -webkit-backdrop-filter: blur(16px) saturate(1.8);
    border-bottom: 1px solid rgba(0,0,0,.04);
    padding: 20px 24px 16px;
  }
  .header-inner {
    max-width: 1120px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 42px; height: 42px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 4px 14px rgba(79,70,229,.35);
  }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .brand p { font-size: 12px; color: var(--text-3); margin-top: -2px; }

  /* ===== 工具栏 ===== */
  .toolbar {
    max-width: 1120px; margin: 20px auto 0; padding: 0 24px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .search-wrap {
    flex: 1; min-width: 220px; position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 11px 16px 11px 42px; border-radius: var(--radius);
    border: 1.5px solid #e5e7eb; font-size: 14px; outline: none;
    background: var(--surface); transition: var(--transition); color: var(--text);
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 14px; opacity: .6; pointer-events: none;
  }
  .btn {
    padding: 11px 20px; border: none; border-radius: var(--radius); cursor: pointer;
    font-size: 14px; font-weight: 600; transition: var(--transition); user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary {
    background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,.3);
  }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,.35); }
  .btn-primary:active { transform: scale(.98); }
  .btn-ghost { background: var(--surface); color: var(--text-2); border: 1.5px solid #e5e7eb; }
  .btn-ghost:hover { background: #f3f4f6; border-color: #d1d5db; }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1.5px solid #fecaca; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }

  /* ===== 统计 + 横幅 ===== */
  .banner {
    max-width: 1120px; margin: 16px auto 0; padding: 0 24px;
  }
  .banner-inner {
    display: none; align-items: center; gap: 10px; padding: 12px 18px;
    background: var(--warning-bg); border: 1px solid #fde68a; border-radius: var(--radius);
    font-size: 13px; color: #92400e; animation: slideDown .3s ease;
  }
  .banner-inner.show { display: flex; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .stats {
    max-width: 1120px; margin: 16px auto 0; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid #e5e7eb; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; color: var(--text-2); font-weight: 500;
    box-shadow: var(--shadow);
  }

  /* ===== 卡片列表 ===== */
  .grid {
    max-width: 1120px; margin: 18px auto 80px; padding: 0 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px;
  }
  .card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 24px; cursor: pointer; position: relative; overflow: hidden;
    border: 1px solid rgba(0,0,0,.04);
    box-shadow: var(--shadow); transition: var(--transition);
    animation: cardIn .4s ease both;
  }
  .card:nth-child(1){ animation-delay: .02s }
  .card:nth-child(2){ animation-delay: .04s }
  .card:nth-child(3){ animation-delay: .06s }
  .card:nth-child(4){ animation-delay: .08s }
  .card:nth-child(5){ animation-delay: .10s }
  .card:nth-child(6){ animation-delay: .12s }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: var(--shadow-lg);
    border-color: rgba(79,70,229,.08);
  }
  .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    transition: var(--transition);
  }
  .card:hover .avatar { transform: scale(1.08); }
  .card-info { min-width: 0; }
  .card-info h3 {
    font-size: 17px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-info .sub {
    font-size: 13px; color: var(--text-3); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-light); color: var(--accent);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
    transition: var(--transition);
  }
  .tag:hover { background: #e0e7ff; }
  .card-meta {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid #f3f4f6;
    display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; color: var(--text-2);
  }
  .card-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .birthday-soon { color: #ea580c; font-weight: 600; }
  .empty {
    grid-column: 1/-1; text-align: center; color: var(--text-3); padding: 100px 20px;
  }
  .empty .big { font-size: 64px; margin-bottom: 16px; opacity: .5; }
  .empty p { font-size: 15px; }

  /* ===== 弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
    padding: 32px; box-shadow: var(--shadow-xl); animation: pop .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h2 { margin-bottom: 24px; font-size: 20px; font-weight: 700; }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600; color: var(--text-2);
    margin-bottom: 6px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: var(--radius-sm);
    font-size: 14px; outline: none; transition: var(--transition); color: var(--text); background: var(--surface);
    font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1);
  }
  .form-group textarea { resize: vertical; min-height: 90px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* 详情弹窗 */
  .detail-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .detail-head .avatar { width: 64px; height: 64px; font-size: 26px; }
  .detail-row { padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--text-3); display: inline-block; width: 64px; font-weight: 500; }
  .detail-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .detail-row a:hover { text-decoration: underline; }

  /* ===== 密码锁屏 ===== */
  .lock-screen {
    position: fixed; inset: 0; z-index: 200;
    background: linear-gradient(135deg, #eef2ff 0%, #f8f9fc 50%, #faf5ff 100%);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-screen.show { display: flex; }
  .lock-card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 40px 36px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: var(--shadow-xl); animation: pop .3s cubic-bezier(.34,1.56,.64,1);
  }
  .lock-icon {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 32px; box-shadow: 0 8px 24px rgba(79,70,229,.35);
  }
  .lock-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .lock-card p { font-size: 13px; color: var(--text-3); margin-bottom: 24px; }
  .lock-card input {
    width: 100%; padding: 13px 16px; border: 1.5px solid #e5e7eb; border-radius: var(--radius-sm);
    font-size: 15px; outline: none; text-align: center; letter-spacing: 2px;
    transition: var(--transition); margin-bottom: 12px; font-family: inherit;
  }
  .lock-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .lock-card .btn { width: 100%; justify-content: center; padding: 13px; }
  .lock-error {
    color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px;
  }
  .lock-card.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-8px); }
    40%,80% { transform: translateX(8px); }
  }
  .lock-tip { margin-top: 16px; font-size: 12px; color: var(--text-3); }
  .lock-tip a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .lock-tip a:hover { text-decoration: underline; }

  /* ===== 图片上传 ===== */
  .upload-row { display: flex; gap: 10px; align-items: center; }
  .upload-preview {
    width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover;
    border: 1.5px solid #e5e7eb; display: none; background: #f3f4f6;
  }
  .upload-preview.show { display: block; }
  img.avatar { object-fit: cover; border: none; }
  .sticker-img { width: 36px; height: 36px; object-fit: contain; margin-left: auto; }

  /* ===== 星空视图 ===== */
  #skyView { max-width: 1120px; margin: 18px auto 80px; padding: 0 24px; display: none; }
  .sky-inner {
    position: relative; height: 72vh; min-height: 520px;
    border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: var(--shadow-lg), inset 0 0 140px rgba(0,0,0,.55);
    background:
      radial-gradient(ellipse 60% 45% at 72% 18%, rgba(124,58,237,.28), transparent 70%),
      radial-gradient(ellipse 55% 40% at 22% 78%, rgba(37,99,235,.22), transparent 70%),
      linear-gradient(160deg, #131a3a 0%, #0b1029 45%, #05070f 100%);
  }
  .bg-star {
    position: absolute; border-radius: 50%; background: #fff; opacity: .5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity:.18; transform:scale(.7); } 50% { opacity:.85; transform:scale(1.1); } }

  .star {
    position: absolute; width: var(--s); height: var(--s); border-radius: 50%;
    background: var(--c); cursor: pointer; z-index: 2;
    box-shadow: 0 0 8px var(--c), 0 0 22px var(--c), 0 0 46px var(--c);
    animation: starPulse 3.4s ease-in-out infinite;
    transition: opacity .3s;
  }
  .star::before {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35);
  }
  @keyframes starPulse {
    0%,100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.18); filter: brightness(1.25); }
  }
  .star:hover { animation-play-state: paused; transform: scale(1.6); z-index: 6; }
  .star-name {
    position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(235,239,255,.92); white-space: nowrap; letter-spacing: .5px;
    text-shadow: 0 0 8px rgba(0,0,0,.9); pointer-events: none;
  }
  .star-tip {
    position: absolute; bottom: calc(100% + 12px); left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: rgba(10,14,35,.92); border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #e5e9ff;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: var(--transition); z-index: 7;
  }
  .star:hover .star-tip { opacity: 1; transform: translateX(-50%) translateY(0); }
  .star-bday { --c: #fbbf24; animation-duration: 1.6s; }
  .star-dim { opacity: .12; }
  .sky-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(200,208,255,.55); font-size: 14px; letter-spacing: 1px; text-align: center; padding: 20px;
  }
  .shooting-star {
    position: absolute; top: 14%; left: 78%; width: 130px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, #fff, transparent); opacity: 0;
    animation: shoot 11s linear infinite;
  }
  @keyframes shoot {
    0%, 70% { opacity: 0; transform: translate(0,0) rotate(-32deg); }
    72% { opacity: 1; }
    84% { opacity: 0; transform: translate(-42vw, 24vh) rotate(-32deg); }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<!-- 密码锁屏 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card" id="lockCard">
    <div class="lock-icon">🔒</div>
    <h2 id="lockTitle">朋友档案馆</h2>
    <p id="lockDesc">请输入密码解锁</p>
    <div class="lock-error" id="lockError"></div>
    <input type="password" id="lockPwd" placeholder="输入密码" maxlength="32" autocomplete="off">
    <button class="btn btn-primary" id="lockBtn" onclick="submitLock()">解锁</button>
    <div class="lock-tip" id="lockTip"></div>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">👥</div>
      <div>
        <h1>朋友档案馆</h1>
        <p>记录每一份珍贵的友谊</p>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="stat-pill" id="roleBadge" style="display:none"></span>
      <button class="btn btn-ghost btn-sm" id="viewToggle" onclick="toggleView()" title="切换视图">⭐ 星空</button>
      <button class="btn btn-ghost btn-sm" id="shareBtn" onclick="exportShare()" title="导出分享版">📤 分享</button>
      <button class="btn btn-ghost btn-sm" onclick="lockNow()" title="锁定">🔒 锁定</button>
      <button class="btn btn-primary" id="addBtn" onclick="openForm()">＋ 新建档案</button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="搜索姓名、爱好、标签…">
  </div>
  <select id="sortSelect" class="btn btn-ghost" style="outline:none; padding-right:28px">
    <option value="new">最近添加</option>
    <option value="name">按姓名</option>
    <option value="birthday">按生日</option>
  </select>
</div>

<div class="banner" id="birthdayBanner"><div class="banner-inner" id="birthdayInner"></div></div>

<div class="stats" id="statsBar"></div>
<div class="grid" id="cardGrid"></div>

<!-- 星空视图 -->
<div id="skyView">
  <div class="sky-inner" id="skyInner"></div>
</div>

<!-- 新建/编辑 表单弹窗 -->
<div class="modal-mask" id="formMask">
  <div class="modal">
    <h2 id="formTitle">新建朋友档案</h2>
    <form id="friendForm" onsubmit="saveFriend(event)">
      <input type="hidden" id="fId">
      <div class="form-group">
        <label>姓名 *</label>
        <input id="fName" required maxlength="20" placeholder="朋友的名字">
      </div>
      <div class="form-group">
        <label>昵称</label>
        <input id="fNickname" maxlength="20" placeholder="平时怎么称呼TA">
      </div>
      <div class="form-group">
        <label>照片</label>
        <div class="upload-row">
          <img class="upload-preview" id="photoPreview" alt="">
          <input type="file" id="fPhoto" accept="image/*" style="display:none" onchange="onPhotoPick(event)">
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('fPhoto').click()">📷 选择照片</button>
          <button type="button" class="btn btn-ghost btn-sm" id="photoClearBtn" style="display:none" onclick="clearPhoto()">移除</button>
        </div>
      </div>
      <div class="form-group">
        <label>生日</label>
        <input id="fBirthday" type="date">
      </div>
      <div class="form-group">
        <label>电话</label>
        <input id="fPhone" maxlength="20" placeholder="手机号码">
      </div>
      <div class="form-group">
        <label>爱好 / 标签</label>
        <input id="fTags" placeholder="用逗号分隔，如：篮球, 音乐, 吃货">
      </div>
      <div class="form-group">
        <label>最喜欢的表情包</label>
        <input id="fEmoji" maxlength="10" placeholder="输入 emoji，如：🐶 😂">
        <div class="upload-row" style="margin-top:8px">
          <img class="upload-preview" id="stickerPreview" alt="">
          <input type="file" id="fSticker" accept="image/*" style="display:none" onchange="onStickerPick(event)">
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('fSticker').click()">�️ 或上传图片</button>
          <button type="button" class="btn btn-ghost btn-sm" id="stickerClearBtn" style="display:none" onclick="clearSticker()">移除</button>
        </div>
      </div>
      <div class="form-group">
        <label>口头禅</label>
        <input id="fCatchphrase" maxlength="50" placeholder="TA最常说的话">
      </div>
      <div class="form-group">
        <label>最喜欢的一句话</label>
        <input id="fQuote" maxlength="100" placeholder="TA的人生格言或最爱引用">
      </div>
      <div class="form-group">
        <label>雷区（不喜欢别人做什么）</label>
        <textarea id="fDislike" placeholder="如：不喜欢被放鸽子、讨厌别人动TA的东西…"></textarea>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="fNote" placeholder="想记住的任何事情…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeForm()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="detailMask">
  <div class="modal" id="detailContent"></div>
</div>

<script>
const STORE_KEY = 'friend_archive_v1';
const EMBEDDED_DATA = null; // 分享版会自动注入数据，请勿手动修改本行

function hashPwd(pwd) {
  const msg = 'friend_archive_salt::' + pwd;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < msg.length; i++) {
    const ch = msg.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h2>>>0).toString(16) + (h1>>>0).toString(16);
}

// 云端同步：拉取最新数据；若云端为空而本地有数据，则自动把本地数据迁移上云（只发生一次）
async function syncFromCloud() {
  if (!db) return;
  try {
    const { data, error } = await db.from(DB_TABLE).select('*');
    if (error) throw error;
    const migrated = localStorage.getItem('fa_cloud_migrated');
    if (data && data.length) {
      friends = data;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
      localStorage.setItem('fa_cloud_migrated', '1');
      render();
    } else if (friends.length && !migrated) {
      await persist(); // 首次迁移：本地 → 云端
      localStorage.setItem('fa_cloud_migrated', '1');
    } else if (!friends.length || migrated) {
      friends = []; // 云端确实是空的（例如管理员删光了），以云端为准
      try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
      render();
    }
  } catch(e) { console.warn('云端同步失败，本次使用本地数据：', e); }
}

function exportShare() {
  if (currentRole !== 'admin') { alert('仅管理员可导出。'); return; }
  const data = JSON.stringify(friends);
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const injected = html.replace(/const EMBEDDED_DATA = (?:null|\[.*?\]);/, 'const EMBEDDED_DATA = ' + data + ';');
  if (injected === html) { alert('导出失败：未找到注入点'); return; }
  const blob = new Blob([injected], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '朋友档案-分享版.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function persist() {
  // 每次完整保存到本地兜底
  try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
  // 同步云端（只在数据库已配置时）
  if (!db) return;
  try {
    const { error } = await db.from(DB_TABLE).upsert(friends, { onConflict: 'id' });
    if (error) console.warn('云端同步失败：', error);
  } catch(e) { console.warn('云端同步异常：', e); }
}

/* ---------- 工具 ---------- */
function getZodiac(b) {
  if(!b) return '';
  const [,m,d] = b.split('-').map(Number);
  const z = [20,19,21,20,21,22,23,23,23,24,23,22];
  const names = ['摩羯','水瓶','双鱼','白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯'];
  return names[m-1 + (d >= z[m-1] ? 1 : 0)];
}
function getAge(b) {
  if(!b) return null;
  const today = new Date();
  const [y,m,d] = b.split('-').map(Number);
  let age = today.getFullYear() - y;
  if (today.getMonth()+1 < m || (today.getMonth()+1 === m && today.getDate() < d)) age--;
  return age >= 0 ? age : null;
}
function daysToBirthday(b) {
  if (!b) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const [, m, d] = b.split('-').map(Number);
  let next = new Date(today.getFullYear(), m-1, d);
  if (next < today) next = new Date(today.getFullYear()+1, m-1, d);
  return Math.round((next - today) / 86400000);
}

/* ---------- 渲染 ---------- */
function render() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  const grid = document.getElementById('cardGrid');
  const bannerInner = document.getElementById('birthdayInner');
  const stats = document.getElementById('statsBar');

  let list = friends.filter(f => {
    if (!kw) return true;
    return [f.name, f.nickname, f.tags, f.note, f.phone]
      .filter(Boolean).join(' ').toLowerCase().includes(kw);
  });

  if (sort === 'name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else if (sort === 'birthday') {
    list.sort((a,b)=>{
      const da = daysToBirthday(a.birthday), db = daysToBirthday(b.birthday);
      return (da==null?9999:da) - (db==null?9999:db);
    });
  } else list.sort((a,b)=>b.created - a.created);

  // 统计
  stats.innerHTML = friends.length
    ? `<span class="stat-pill">🧑‍🤝‍🧑 共 ${friends.length} 位朋友</span>${kw?`<span class="stat-pill">🔍 匹配 ${list.length} 位</span>`:''}`
    : '';

  // 生日提醒（30天内）
  const upcoming = friends
    .map(f=>({f, d: daysToBirthday(f.birthday)}))
    .filter(x=>x.d!==null && x.d<=30)
    .sort((a,b)=>a.d-b.d);
  if (upcoming.length) {
    bannerInner.className = 'banner-inner show';
    bannerInner.innerHTML = '🎂 ' + upcoming.map(({f,d})=>
      d===0 ? `<b>${esc(f.name)}</b> 今天生日 🎉` : `<b>${esc(f.name)}</b> ${d} 天后生日`
    ).join('　·　');
  } else bannerInner.className = 'banner-inner';

  // 卡片
  if (!list.length) {
    const emptyTip = friends.length
      ? '没有找到匹配的朋友'
      : (currentRole === 'admin' ? '还没有档案，点击右上角「新建档案」开始吧' : '暂无档案，请联系管理员添加');
    grid.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${emptyTip}</p>
    </div>`;
  } else {
  grid.innerHTML = list.map(f=>{
    const d = daysToBirthday(f.birthday);
    const age = getAge(f.birthday);
    const zodiac = getZodiac(f.birthday);
    const tags = (f.tags||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    return `<div class="card" onclick="openDetail('${f.id}')">
      <div class="card-head">
        ${avatarHTML(f)}
        <div class="card-info">
          <h3>${esc(f.name)}</h3>
          <div class="sub">${f.nickname?esc(f.nickname)+' · ':''}${zodiac?esc(zodiac)+'座':''}${age!=null?' · '+age+'岁':''}</div>
        </div>
        ${stickerHTML(f)}
      </div>
      ${f.catchphrase?`<div style="font-size:13px;color:var(--text-2);font-style:italic;margin:-6px 0 10px">"${esc(f.catchphrase)}"</div>`:''}
      <div class="tag-row">${tags.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="card-meta">
        ${f.phone?`<span>📞 ${esc(f.phone)}</span>`:''}
        ${f.birthday?`<span class="${d!==null&&d<=7?'birthday-soon':''}">🎂 ${d===0?'今天！':d+'天后'}</span>`:''}
      </div>
    </div>`;
  }).join('');
  }

  // 星空
  renderSky(list, kw);
}

/* ---------- 星空视图 ---------- */
// 用 id 做稳定伪随机，保证同一颗星星位置不变
function seedOf(id) {
  let h = 2166136261;
  for (const c of String(id)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}

function renderSky(list, kw) {
  const sky = document.getElementById('skyInner');
  if (!sky) return;

  // 背景小星星只生成一次
  if (!sky.dataset.bgInit) {
    sky.dataset.bgInit = '1';
    let bg = '';
    for (let i = 0; i < 90; i++) {
      const sz = (Math.random() * 1.6 + 0.6).toFixed(1);
      bg += `<div class="bg-star" style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*4).toFixed(1)}s;animation-duration:${(Math.random()*3+3).toFixed(1)}s"></div>`;
    }
    bg += '<div class="shooting-star"></div>';
    sky.innerHTML = bg;
  }
  // 移除旧的朋友星星
  sky.querySelectorAll('.star,.sky-hint').forEach(e=>e.remove());

  if (!friends.length) {
    sky.insertAdjacentHTML('beforeend', `<div class="sky-hint">这片夜空还没有星星<br>点击右上角「新建档案」点亮第一颗 ⭐</div>`);
    return;
  }

  const matchedIds = new Set(list.map(f=>f.id));
  const html = friends.map(f => {
    const s1 = seedOf(f.id), s2 = seedOf(f.id + 'y');
    const x = 5 + s1 * 88;        // 5% ~ 93%
    const y = 6 + s2 * 78;        // 6% ~ 84%
    const size = (10 + seedOf(f.id + 's') * 8).toFixed(0);  // 10~18px
    const color = colorOf(f.id);
    const d = daysToBirthday(f.birthday);
    const soon = d !== null && d <= 7;
    const dimmed = kw && !matchedIds.has(f.id);
    const delay = (seedOf(f.id + 'd') * 3.4).toFixed(2);
    const tipLines = [];
    if (f.catchphrase) tipLines.push(`💬 "${esc(f.catchphrase)}"`);
    if (f.birthday) tipLines.push(`🎂 ${d===0 ? '今天生日！' : d + ' 天后生日'}`);
    if (f.tags) tipLines.push(`🏷️ ${esc(f.tags)}`);
    return `<div class="star${soon ? ' star-bday' : ''}${dimmed ? ' star-dim' : ''}"
      style="left:${x}%;top:${y}%;--c:${color};--s:${size}px;animation-delay:${delay}s"
      onclick="openDetail('${f.id}')">
      <div class="star-tip">${tipLines.join('<br>') || '点击查看档案'}</div>
      <div class="star-name">${esc(f.name)}</div>
    </div>`;
  }).join('');
  sky.insertAdjacentHTML('beforeend', html);
}

/* ---------- 图片处理 ---------- */
let tempPhoto = '', tempSticker = '';

function compressImage(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize/width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize/height; height = maxSize; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function onPhotoPick(e) {
  const file = e.target.files[0]; if (!file) return;
  compressImage(file, 200, data => {
    tempPhoto = data;
    const p = document.getElementById('photoPreview');
    p.src = data; p.classList.add('show');
    document.getElementById('photoClearBtn').style.display = 'inline-flex';
  });
  e.target.value = '';
}
function clearPhoto() {

  document.getElementById('photoPreview').classList.remove('show');
  document.getElementById('photoClearBtn').style.display = 'none';
}
function onStickerPick(e) {
  const file = e.target.files[0]; if (!file) return;
  compressImage(file, 120, data => {
    tempSticker = data;
    const p = document.getElementById('stickerPreview');

    ${f.catchphrase?`<div class="detail-row"><span class="k">口头禅</span>"${esc(f.catchphrase)}"</div>`:''}
    ${f.quote?`<div class="detail-row"><span class="k">最爱的话</span><i>${esc(f.quote)}</i></div>`:''}
    ${f.dislike?`<div class="detail-row"><span class="k">⚠️ 雷区</span><span style="color:var(--danger)">${esc(f.dislike).replace(/\n/g,'<br>')}</span></div>`:''}
    ${f.note?`<div class="detail-row"><span class="k">备注</span>${esc(f.note).replace(/\n/g,'<br>')}</div>`:''}
    <div class="modal-actions">
      ${isAdmin?`<button class="btn btn-danger btn-sm" onclick="removeFriend('${f.id}')">删除</button>`:''}
      <button class="btn btn-ghost btn-sm" onclick="closeDetail()">关闭</button>
      ${isAdmin?`<button class="btn btn-primary btn-sm" onclick="editFromDetail('${f.id}')">编辑</button>`:''}
    </div>`;
  document.getElementById('detailMask').classList.add('show');
}
function closeDetail(){ document.getElementById('detailMask').classList.remove('show'); }
function editFromDetail(id){ closeDetail(); openForm(friends.find(x=>x.id===id)); }
function removeFriend(id){
  if (currentRole !== 'admin') { alert('访客模式无法删除。'); return; }
  const f = friends.find(x=>x.id===id);
  if (!f) return;
  if (!confirm(`确定要删除「${f.name}」的档案吗？此操作不可恢复。`)) return;
  friends = friends.filter(x=>x.id!==id);
  closeDetail(); render();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(friends)); } catch(e){}
  dbDelete(id); // 后台从云端删除
}

/* ---------- 事件 ---------- */
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('formMask').addEventListener('click', e=>{ if(e.target.id==='formMask') closeForm(); });
document.getElementById('detailMask').addEventListener('click', e=>{ if(e.target.id==='detailMask') closeDetail(); });

// 启动：先用本地缓存秒开，再从云端拉取最新数据
const savedRole = sessionStorage.getItem('fa_role');
if (savedRole === 'admin' || savedRole === 'guest') {
  currentRole = savedRole;
  unlock();
} else {
  showLock();
}
applyViewMode();
syncFromCloud();
</script>
</body>
</html>
